<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>SMod Tray Lyric</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --lyric: rgb(248 215 192); }
  html, body {
    width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI",
      Roboto, Ubuntu, Cantarell, "Noto Sans", "Helvetica Neue", Arial, "PingFang SC",
      "Microsoft YaHei UI", "Microsoft YaHei", "Source Han Sans CN",
      "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
  }
  #card {
    position: absolute; inset: 0;
    border-radius: 10px;
    overflow: hidden;
    background: rgb(20, 20, 28);
    border: 1px solid rgba(255, 255, 255, 0.10);
    /* 默认完全透明：窗口 show 出来的那一帧不能先露出完整内容，
       否则动画会从 0 重新开始，看起来就是闪一下 */
    opacity: 0;
  }
  #bg {
    position: absolute; inset: -60px;
    width: calc(100% + 120px); height: calc(100% + 120px);
    object-fit: cover;
    filter: blur(45px) saturate(1.2);
    opacity: 1;
  }
  #veil {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(12, 12, 18, 0.20) 0%, rgba(12, 12, 18, 0.58) 100%);
  }
  #content {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    padding: 14px 12px 42px;
    display: flex; flex-direction: column;
  }
  #meta { text-align: center; flex: 0 0 auto; margin-bottom: 6px; }
  #title {
    font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.92);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #artist {
    margin-top: 2px; font-size: 10px; color: rgba(255, 255, 255, 0.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #lyricRegion {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    mask-image: linear-gradient(180deg, transparent 0, #000 10%, #000 90%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10%, #000 90%, transparent 100%);
  }
  #lyricBox {
    width: 100%;
    display: flex; flex-direction: column;
    justify-content: center;
    text-align: center;
  }
  .lrow {
    height: 1.58em; line-height: 1.58em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--lyric);
    /* 颜色严格跟播放页一致，可读性靠阴影补，不掺白改色 */
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.42);
    transition: opacity 0.22s ease, filter 0.22s ease, transform 0.22s ease;
  }
  .lrow.cur { font-size: 1.06em; font-weight: 600; }
  .lrow.tr {
    height: 1.45em; line-height: 1.45em;
    font-size: max(9px, 0.68em); opacity: 0.55;
  }
  /* 逐字点亮：每个字按自己的进度改透明度，不做整行扫描 */
  .ly-char {
    color: var(--lyric);
    opacity: calc(0.22 + 0.78 * var(--p, 0));
    transition: opacity 0.06s linear;
  }
  @keyframes lrowBump {
    from { transform: translateY(6px) scale(0.965); opacity: 0.45; }
    to { transform: none; opacity: 1; }
  }
  .lrow.cur.bump { animation: lrowBump 0.26s cubic-bezier(0.2, 0.8, 0.2, 1); }
  #empty {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: rgba(255, 255, 255, 0.42);
  }
  #empty.hidden { display: none; }
  #fft {
    position: absolute; left: 10px; right: 10px; bottom: 8px;
    /* 必须显式给宽度：canvas 的 width 属性是绘制缓冲区尺寸，
       不写 CSS 宽度时浏览器会拿它当布局尺寸，频谱会被压成几十像素 */
    width: calc(100% - 20px);
    height: 26px; z-index: 3; pointer-events: none;
    opacity: 0.85;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.94) translateX(-10px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes cardOut {
    from { opacity: 1; transform: none; }
    to { opacity: 0; transform: scale(0.965) translateX(-8px); }
  }
  body.open #card { opacity: 1; animation: cardIn 0.24s cubic-bezier(0.2, 0.8, 0.2, 1); }
  body.closing #card { opacity: 1; animation: cardOut 0.16s ease-in forwards; }

  /* 当前行放不下时自动来回滚动；非当前行仍然用省略号 */
  .cur-inner {
    display: block; width: 100%;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="card">
    <img id="bg" alt="" />
    <div id="veil"></div>
    <div id="content">
      <div id="meta">
        <div id="title"></div>
        <div id="artist"></div>
      </div>
      <div id="lyricRegion">
        <div id="lyricBox"></div>
      </div>
    </div>
    <canvas id="fft"></canvas>
    <div id="empty" class="hidden">暂无歌词</div>
  </div>

<script>
  var api = window.SMOD_TRAY;
  var bg = document.getElementById("bg");
  var titleEl = document.getElementById("title");
  var artistEl = document.getElementById("artist");
  var region = document.getElementById("lyricRegion");
  var box = document.getElementById("lyricBox");
  var emptyEl = document.getElementById("empty");

  var lines = [];
  var srcSig = "";
  var curIdx = -2;
  var curLine = null;
  var spans = [];
  var rows = [];
  var base = 0, at = 0, hold = 0;
  var playing = false;
  var sizeOffset = 0;
  var reverseOrder = false;
  var fftOn = true;
  var fftWidth = 100;
  var fftReverse = false;

  function nowMs() {
    return playing ? base + (Date.now() - at) : hold;
  }

  var clockInit = false;

  // 每秒刷新一次进度，如果每次都把基准硬重置，采样误差会让当前行来回跳（瞎滚）。
  // 这里分三档：小误差不动、中误差平滑追、大误差（切歌/拖动）直接对齐。
  function syncClock(t) {
    if (typeof t.posMs !== "number") return;
    var now = Date.now();
    var target = t.posMs + Math.max(0, now - (t.stamp || now));

    if (!playing) {
      base = target; at = now; hold = target;
      return;
    }
    if (!clockInit) {
      clockInit = true;
      base = target; at = now; hold = target;
      return;
    }

    var cur = base + (now - at);
    var drift = target - cur;
    if (Math.abs(drift) > 1200) {
      base = target; at = now; hold = target;
    } else if (Math.abs(drift) > 60) {
      base = cur + drift * 0.25;
      at = now;
    }
  }

  var measureCtx = null;
  var fontFam = null;

  function textWidth(text, size) {
    if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
    if (!fontFam) fontFam = getComputedStyle(box).fontFamily || "sans-serif";
    measureCtx.font = size + "px " + fontFam;
    return measureCtx.measureText(text).width;
  }

  // 字号按实际像素宽度拟合，行数按可用高度反推。
  // 不能按字符数估：英文每字符比中文窄一半，按字数算会把英文压到 12px 下限，
  // 行距跟着变窄，整屏看起来就挤成一团。
  function calcLayout() {
    var w = box.clientWidth || 210;
    var samples = [];
    for (var k = -3; k <= 3; k++) {
      var l = lines[curIdx + k];
      if (l && l.t) samples.push(l.t);
    }
    if (!samples.length) samples.push("♪");

    var room = (w - 2) / 1.06;
    var fs = 12;
    for (var s = 26; s >= 12; s--) {
      var ok = true;
      for (var j = 0; j < samples.length; j++) {
        if (textWidth(samples[j], s) > room) { ok = false; break; }
      }
      if (ok) { fs = s; break; }
    }
    // 面板里的手动字号偏移，0 = 纯自适应
    fs = Math.max(12, Math.min(34, fs + sizeOffset));

    var avail = (region.clientHeight || 360) - 6;
    var n = Math.floor(avail / (fs * 1.58));
    n = Math.max(3, Math.min(19, n));
    if (n % 2 === 0) n -= 1;
    box.style.fontSize = fs + "px";
    return n;
  }

  var curInner = null;

  function buildSpans(el, line) {
    el.innerHTML = "";
    spans = [];
    var inner = document.createElement("div");
    inner.className = "cur-inner";
    el.appendChild(inner);
    curInner = inner;

    var chars = Array.from((line && line.t) || "♪");
    for (var i = 0; i < chars.length; i++) {
      var sp = document.createElement("span");
      sp.className = "ly-char";
      sp.textContent = chars[i];
      inner.appendChild(sp);
      spans.push({ el: sp, w: ((line && line.w) || [])[i] || null });
    }
  }

  function paint(ms) {
    for (var i = 0; i < spans.length; i++) {
      var it = spans[i], p = 0;
      if (it.w && it.w[1] > it.w[0]) p = (ms - it.w[0]) / (it.w[1] - it.w[0]);
      else if (it.w) p = ms >= it.w[1] ? 1 : 0;
      else if (curLine && curLine.e > curLine.s) p = (ms - curLine.s) / (curLine.e - curLine.s);
      p = Math.max(0, Math.min(1, p));
      // 前 5% 当成还没开始，避免时钟有几十毫秒提前时"没到的字"先亮一点
      if (p < 0.05) p = 0;
      it.el.style.setProperty("--p", p.toFixed(3));
    }
  }

  function rebuild() {
    var n = calcLayout();
    var half = (n - 1) / 2;
    box.innerHTML = "";
    rows = [];
    curLine = lines[curIdx] || null;

    // 开头 / 结尾处不足 half 行时不补空行，整块在区域内居中
    var startK = -Math.min(half, curIdx);
    var endK = Math.min(half, lines.length - 1 - curIdx);

    var order = [];
    for (var k0 = startK; k0 <= endK; k0++) order.push(k0);
    if (reverseOrder) order.reverse();
    var curPos = order.indexOf(0);

    for (var oi = 0; oi < order.length; oi++) {
      var k = order[oi];
      var line = lines[curIdx + k];
      var el = document.createElement("div");
      el.className = "lrow" + (k === 0 ? " cur" : "");
      if (k === 0) {
        buildSpans(el, line);
      } else {
        var dist = Math.abs(k);
        el.textContent = line ? line.t : "";
        el.style.opacity = String(Math.max(0.08, 0.46 - dist * 0.05));
        el.style.filter = "blur(" + Math.min(2.4, 0.45 + dist * 0.3).toFixed(2) + "px)";
        el.style.transform = "scale(" + Math.max(0.9, 1 - dist * 0.011).toFixed(3) + ")";
      }
      box.appendChild(el);
      rows.push(el);
    }

    // 译文紧跟当前行
    if (curLine && curLine.tr) {
      var tr = document.createElement("div");
      tr.className = "lrow tr";
      tr.textContent = curLine.tr;
      box.insertBefore(tr, rows[curPos + 1] || null);
    }

    var curEl = rows[curPos];
    curEl.classList.remove("bump");
    void curEl.offsetWidth;
    curEl.classList.add("bump");
  }

  function draw() {
    if (!lines.length) {
      // 清空 DOM：只显示「暂无歌词」而留着旧的行，旧歌词会从下面透出来
      if (box.childElementCount) {
        box.innerHTML = "";
        rows = [];
        spans = [];
        curInner = null;
        curLine = null;
      }
      emptyEl.classList.remove("hidden");
      return;
    }
    emptyEl.classList.add("hidden");

    var ms = nowMs();
    var cur = -1;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].s <= ms) cur = i;
      else break;
    }
    if (cur !== curIdx) {
      curIdx = cur;
      rebuild();
    }
    paint(ms);
  }

  // 播放页的 --lp-color 直接取自封面主色，可能是深棕/深蓝。
  // 贴在模糊背景上会看不清，这里按亮度做一次兜底提亮。
  function readable(c) {
    var m = String(c).match(/\d+(\.\d+)?/g);
    if (!m || m.length < 3) return c;
    var r = Number(m[0]), g = Number(m[1]), b = Number(m[2]);
    var lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
    if (lum >= 0.55) return c;
    var t = Math.min(1, (0.72 - lum) / 0.72);
    var mix = function (v) { return Math.round(v + (255 - v) * (0.55 + t * 0.3)); };
    return "rgb(" + mix(r) + " " + mix(g) + " " + mix(b) + ")";
  }

  function render(d) {
    if (!d) return;
    var t = d.track || {};
    titleEl.textContent = t.title || "未在播放";
    artistEl.textContent = t.artist || "";

    if (t.cover && bg.getAttribute("src") !== t.cover) bg.src = t.cover;
    if (t.color) document.documentElement.style.setProperty("--lyric", t.color);

    playing = !!t.playing;
    if (Array.isArray(t.lines)) {
      var first = t.lines[0];
      var sig = t.lines.length + ":" + (first ? first.s + first.t : "");
      if (sig !== srcSig) {
        srcSig = sig;
        lines = t.lines;
        curIdx = -2;
      }
    }
    fftOn = d.fftOn !== false;
    fftWidth = Math.max(40, Math.min(100, Number(d.fftWidth) || 100));
    fftReverse = d.fftReverse === true;

    var nextRev = d.reverse === true;
    if (nextRev !== reverseOrder) {
      reverseOrder = nextRev;
      if (lines.length && curIdx !== -2) rebuild();
    }

    var nextOffset = Number(d.sizeOffset) || 0;
    if (nextOffset !== sizeOffset) {
      sizeOffset = nextOffset;
      sizeFft();
      if (lines.length && curIdx !== -2) rebuild();
    }

    syncClock(t);
    draw();
  }

  api.onLyric(render);
  api.onLyricOut(function () {
    document.body.classList.remove("open");
    document.body.classList.add("closing");
  });

  var resizeTimer = 0;
  window.addEventListener("resize", function () {
    if (resizeTimer) return;
    resizeTimer = setTimeout(function () {
      resizeTimer = 0;
      sizeFft();
      if (lines.length && curIdx !== -2) rebuild();
    }, 80);
  });

  // 底部频谱：数据由主进程从播放器转发过来（不同进程拿不到 FFT）
  var fftCanvas = document.getElementById("fft");
  var fctx = fftCanvas.getContext("2d");
  var fftData = null;
  var fftLevels = null;

  function sizeFft() {
    var r = fftCanvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    fftCanvas.width = Math.max(1, Math.round(r.width * dpr));
    fftCanvas.height = Math.max(1, Math.round(r.height * dpr));
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeFft();

  api.onFft(function (d) {
    fftData = d;
  });

  function drawFft() {
    var r = fftCanvas.getBoundingClientRect();
    var w = r.width, h = r.height;
    if (!w || !h) return;
    var n = 40;
    if (!fftLevels || fftLevels.length !== n) fftLevels = new Float32Array(n);
    fctx.clearRect(0, 0, w, h);
    if (!fftOn) return;
    // 颜色取播放页的 --lp-color（封面取色），和软件内频谱一致
    var lc = getComputedStyle(document.documentElement).getPropertyValue("--lyric").trim();
    var lm = lc.match(/\d+/g);
    var fftRgb = lm && lm.length >= 3 ? [Number(lm[0]), Number(lm[1]), Number(lm[2])] : [255, 255, 255];
    var src = (fftData && fftData.ldata) || null;
    // 宽度按百分比收窄并居中；反向时低频画到右边
    var pct = Math.max(0.4, Math.min(1, fftWidth / 100));
    var drawW = w * pct;
    var offX = (w - drawW) / 2;
    var bw = drawW / n;
    for (var i = 0; i < n; i++) {
      var v = 0;
      var si = fftReverse ? n - 1 - i : i;
      if (src) {
        var start = Math.floor((si / n) * src.length);
        var end = Math.floor(((si + 1) / n) * src.length);
        for (var j = start; j < end; j++) v = Math.max(v, src[j] || 0);
      }
      // 播放器返回的是 0~1 的归一化幅度，不是 0~255
      var target = Math.min(1, v * 1.2);
      fftLevels[i] += (target - fftLevels[i]) * 0.4;
      var bh = Math.max(1, fftLevels[i] * h);
      fctx.fillStyle = "rgba(" + fftRgb[0] + "," + fftRgb[1] + "," + fftRgb[2] + "," + (0.16 + fftLevels[i] * 0.5).toFixed(3) + ")";
      // 圆角柱，和播放页的频谱一致；从底部向上生长
      var bw2 = Math.max(1, bw - 2);
      fctx.beginPath();
      if (fctx.roundRect) {
        fctx.roundRect(offX + i * bw + 1, h - bh, bw2, bh, Math.min(2, bw2 / 2));
      } else {
        fctx.rect(offX + i * bw + 1, h - bh, bw2, bh);
      }
      fctx.fill();
    }
  }
  setInterval(drawFft, 55);

  setInterval(draw, 60);
  api.lyricReady();
</script>
</body>
</html>
